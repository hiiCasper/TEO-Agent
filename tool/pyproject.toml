[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-eo-agent"
version = "0.1.0"
description = "Executable, evidence-grounded tools for RSRCC temporal change reasoning"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "Pillow>=10.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

